<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 920" width="1050" height="920" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <style>
      .band-label { font-size: 15px; font-weight: 700; fill: #2D3748; text-anchor: middle; }
      .group-title { font-size: 13px; font-weight: 700; fill: #4A5568; text-anchor: middle; }
      .box { fill: #FFFFFF; stroke: #A0AEC0; stroke-width: 1.2; }
      .box-strong { fill: #FFFFFF; stroke: #2B6CB0; stroke-width: 2; }
      .box-dashed { fill: #FFFFFF; stroke: #A0AEC0; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .group { fill: none; stroke: #CBD5E0; stroke-width: 1; stroke-dasharray: 3 3; }
      .chip { fill: #EBF4FF; stroke: #90CDF4; stroke-width: 1; }
      .t { font-size: 14px; font-weight: 700; fill: #1A202C; text-anchor: middle; }
      .s { font-size: 12px; fill: #4A5568; text-anchor: middle; }
      .c { font-size: 12px; fill: #2A4365; }
      .a { stroke: #4A5568; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .al { font-size: 11px; fill: #4A5568; }
      .bracket { stroke: #2B6CB0; stroke-width: 1.5; fill: none; }
      .bracket-label { font-size: 14px; font-weight: 700; fill: #2B6CB0; text-anchor: middle; }
    </style>
  </defs>

  <!-- 1. 호출하는 쪽 -->
  <rect x="20" y="20" width="975" height="160" rx="8" fill="#F7FAFC" stroke="#E2E8F0"/>
  <rect x="20" y="20" width="120" height="160" rx="8" fill="#EDF2F7"/>
  <text class="band-label" x="80" y="96">호출하는 쪽</text>

  <rect class="group" x="160" y="32" width="460" height="136" rx="6"/>
  <text class="group-title" x="390" y="54">Agent 개발자의 코드</text>
  <rect class="box" x="170" y="66" width="140" height="90" rx="6"/>
  <text class="t" x="240" y="96">Agent 호출</text>
  <text class="s" x="240" y="118">start · resume</text>
  <text class="s" x="240" y="137">응용 서버가 호출</text>
  <rect class="box" x="320" y="66" width="140" height="90" rx="6"/>
  <text class="t" x="390" y="96">workflow 정의</text>
  <text class="s" x="390" y="118">State, 노드 함수, 에지</text>
  <text class="s" x="390" y="137">작성</text>
  <rect class="box" x="470" y="66" width="140" height="90" rx="6"/>
  <text class="t" x="540" y="96">도구 구현</text>
  <text class="s" x="540" y="118">도구 함수와</text>
  <text class="s" x="540" y="137">메타데이터 작성</text>

  <rect class="group" x="640" y="32" width="340" height="136" rx="6"/>
  <text class="group-title" x="810" y="54">응답을 보내는 쪽</text>
  <rect class="box" x="650" y="66" width="100" height="90" rx="6"/>
  <text class="t" x="700" y="104">사용자</text>
  <text class="s" x="700" y="124">추가 입력</text>
  <text class="s" x="700" y="141">확인과 인증</text>
  <rect class="box" x="760" y="66" width="100" height="90" rx="6"/>
  <text class="t" x="810" y="104">승인자</text>
  <text class="s" x="810" y="126">승인 또는 반려</text>
  <rect class="box" x="870" y="66" width="100" height="90" rx="6"/>
  <text class="t" x="920" y="104">외부 시스템</text>
  <text class="s" x="920" y="126">처리 결과 통보</text>


  <!-- 2. 정의 API -->
  <rect x="20" y="200" width="975" height="110" rx="8" fill="#F5F3FB" stroke="#D6CCEF"/>
  <rect x="20" y="200" width="120" height="110" rx="8" fill="#EAE5F7"/>
  <text class="band-label" x="80" y="250">정의 API</text>
  <text class="s" x="80" y="270">(라이브러리)</text>

  <rect class="box" x="310" y="215" width="190" height="80" rx="6"/>
  <text class="t" x="405" y="240">workflow 빌더</text>
  <text class="s" x="405" y="261">compile()이 구조와 통제 규칙 검사</text>
  <text class="s" x="405" y="280">명세를 workflow 레지스트리에</text>
  <rect class="box" x="520" y="215" width="190" height="80" rx="6"/>
  <text class="t" x="615" y="240">도구 등록</text>
  <text class="s" x="615" y="261">함수와 메타데이터를</text>
  <text class="s" x="615" y="280">도구 레지스트리에 (검토 전)</text>


  <rect x="20" y="330" width="975" height="250" rx="8" fill="#F0F6FC" stroke="#BEE3F8"/>
  <rect x="20" y="330" width="120" height="250" rx="8" fill="#E1EEFA"/>
  <text class="band-label" x="80" y="448">실행기</text>
  <text class="s" x="80" y="468">(라이브러리)</text>

  <rect class="box-strong" x="160" y="345" width="280" height="220" rx="6"/>
  <text class="t" x="300" y="370">실행 루프</text>
  <text class="s" x="300" y="388">노드를 하나씩 실행하며 반복</text>
  <rect class="chip" x="180" y="400" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="418">① 노드 실행</text>
  <rect class="chip" x="180" y="433" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="451">② 변경분을 State에 반영</text>
  <rect class="chip" x="180" y="466" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="484">③ 에지로 다음 노드 결정</text>
  <rect class="chip" x="180" y="499" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="517">④ 예산 초과 확인</text>
  <rect class="chip" x="180" y="532" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="550">⑤ 체크포인트 저장, 대기면 멈춤</text>

  <rect class="box" x="480" y="345" width="310" height="90" rx="6"/>
  <text class="t" x="635" y="375">응답 처리</text>
  <text class="s" x="635" y="397">응답을 받아 멈춘 run을 이어 감</text>
  <text class="s" x="635" y="416">응답자 자격과 응답 형식 확인</text>

  <rect class="box-dashed" x="820" y="345" width="160" height="90" rx="6"/>
  <text class="t" x="900" y="370">타임아웃 처리</text>
  <text class="s" x="900" y="391">주기적으로 도는 배경 작업</text>
  <text class="s" x="900" y="409">기한이 지난 run을</text>
  <text class="s" x="900" y="426">만료로 처리해 재개</text>

  <rect class="box" x="480" y="455" width="310" height="110" rx="6"/>
  <text class="t" x="635" y="482">미들웨어 체인</text>
  <text class="s" x="635" y="505">노드 실행과 호출의 앞뒤에서 공통 처리</text>
  <text class="s" x="635" y="525">플랫폼 필수: 추적, 권한, 승인 확인, 멱등성 키</text>
  <text class="s" x="635" y="544">Agent 개발자가 추가한 미들웨어</text>

  <rect class="box" x="820" y="455" width="160" height="110" rx="6"/>
  <text class="t" x="900" y="490">추적과 비용 집계</text>
  <text class="s" x="900" y="513">호출별 소요 시간과 토큰</text>
  <text class="s" x="900" y="532">run 단위로 비용 합산</text>

  <!-- 3. 인터페이스와 어댑터 -->
  <rect x="20" y="600" width="975" height="150" rx="8" fill="#F3F8F1" stroke="#C6E2C0"/>
  <rect x="20" y="600" width="120" height="150" rx="8" fill="#E5F1E1"/>
  <text class="band-label" x="80" y="670">인터페이스와</text>
  <text class="band-label" x="80" y="690">어댑터</text>

  <rect class="group" x="160" y="612" width="280" height="126" rx="6"/>
  <text class="group-title" x="300" y="632">저장소 인터페이스</text>
  <rect class="box" x="172" y="644" width="122" height="40" rx="5"/>
  <text class="s" x="233" y="668" font-weight="700" fill="#1A202C">workflow 레지스트리</text>
  <rect class="box" x="306" y="644" width="122" height="40" rx="5"/>
  <text class="s" x="367" y="668" font-weight="700" fill="#1A202C">도구 레지스트리</text>
  <rect class="box" x="172" y="692" width="122" height="40" rx="5"/>
  <text class="s" x="233" y="716" font-weight="700" fill="#1A202C">체크포인트 저장소</text>
  <rect class="box" x="306" y="692" width="122" height="40" rx="5"/>
  <text class="s" x="367" y="716" font-weight="700" fill="#1A202C">세션 저장소</text>

  <rect class="box" x="480" y="612" width="240" height="126" rx="6"/>
  <text class="t" x="600" y="644">모델 어댑터</text>
  <text class="s" x="600" y="670">모델 별칭을 실제 모델로 변환</text>
  <text class="s" x="600" y="690">출력 형식 강제</text>
  <text class="s" x="600" y="710">재시도, 다른 모델로 대체</text>

  <rect class="box" x="740" y="612" width="240" height="126" rx="6"/>
  <text class="t" x="860" y="644">도구 어댑터</text>
  <text class="s" x="860" y="670">시간 제한과 재시도</text>
  <text class="s" x="860" y="690">호출량 제한</text>
  <text class="s" x="860" y="710">외부 시스템 호출</text>

  <!-- 4. 구현과 외부 시스템 -->
  <rect x="20" y="770" width="975" height="130" rx="8" fill="#FAF6F0" stroke="#E8DCC8"/>
  <rect x="20" y="770" width="120" height="130" rx="8" fill="#F3EADC"/>
  <text class="band-label" x="80" y="830">구현과</text>
  <text class="band-label" x="80" y="850">외부 시스템</text>

  <rect class="box" x="160" y="785" width="280" height="100" rx="6"/>
  <text class="t" x="300" y="816">저장소 구현</text>
  <text class="s" x="300" y="840">관계형 DB, 문서 DB, 키-값 저장소,</text>
  <text class="s" x="300" y="859">파일, 메모리 가운데 선택</text>

  <rect class="box" x="480" y="785" width="240" height="100" rx="6"/>
  <text class="t" x="600" y="826">모델 제공자</text>
  <text class="s" x="600" y="850">사내외 LLM 서비스</text>

  <rect class="box" x="740" y="785" width="240" height="100" rx="6"/>
  <text class="t" x="860" y="826">업무 시스템</text>
  <text class="s" x="860" y="850">사내 API, 데이터베이스, 외부 서비스</text>



  <!-- 화살표 -->
  <path class="a" d="M390,157 L390,213"/>
  <text class="al" x="398" y="194">정의</text>
  <path class="a" d="M560,157 L560,213"/>
  <text class="al" x="568" y="194">등록</text>
  <path class="a" d="M240,157 L240,343"/>
  <text class="al" x="248" y="194">실행 요청</text>
  <path class="a" d="M760,169 L760,343"/>
  <text class="al" x="768" y="194">응답</text>

  <path class="a" d="M480,390 L442,390"/>
  <text class="al" x="445" y="382">재개</text>
  <path class="a" d="M820,390 L792,390"/>

  <path class="a" d="M440,510 L478,510"/>
  <path class="a" d="M790,510 L818,510"/>

  <path class="a" d="M300,565 L300,610"/>
  <text class="al" x="308" y="594">저장과 조회</text>
  <path class="a" d="M600,565 L600,610"/>
  <text class="al" x="608" y="594">model.call</text>
  <path class="a" d="M760,565 L760,610"/>
  <text class="al" x="768" y="594">tools.call</text>

  <path class="a" d="M300,738 L300,783"/>
  <path class="a" d="M600,738 L600,783"/>
  <path class="a" d="M860,738 L860,783"/>

  <!-- 프레임워크 범위 -->
  <path class="bracket" d="M1003,200 L1013,200 L1013,750 L1003,750"/>
  <text class="bracket-label" transform="translate(1032,475) rotate(90)">프레임워크</text>
</svg>
